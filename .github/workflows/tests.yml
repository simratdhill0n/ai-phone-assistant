# Runs the tests on GitHub's servers on every push and pull request.
# No model, no GPU, no secrets needed: the tests use a fake LLM.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: pytest -v